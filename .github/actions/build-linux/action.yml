name: Build Linux bundles
description: Builds the Octowatcher .deb and AppImage, and optionally the .rpm.

inputs:
  rpm:
    description: Also build the .rpm, which costs a cargo-generate-rpm install.
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-linux
    - shell: bash
      run: cargo install cargo-bundle --version 0.12.0 --locked
    - if: inputs.rpm == 'true'
      shell: bash
      run: cargo install cargo-generate-rpm --version 0.21.0 --locked
    - shell: bash
      run: cargo build --release
    - shell: bash
      run: |
        for format in deb appimage; do
          cargo bundle --release --format "$format" --binary-path target/release/octowatcher
        done
    # cargo-bundle's rpm format is still a stub.
    - if: inputs.rpm == 'true'
      shell: bash
      run: cargo generate-rpm
