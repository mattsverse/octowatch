name: Set up Linux build
description: Installs the system packages gpui and the tray need, the stable Rust toolchain, and the cargo cache.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
          libx11-xcb-dev libxcb1-dev libfontconfig-dev libssl-dev \
          libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
