name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v7
      # Two targets are combined with lipo into one universal app.
      - uses: ./.github/actions/build-macos
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Sign, notarize, and package macOS release
        timeout-minutes: 90
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash packaging/macos/release.sh
      # TEMP: keep the DMGs for inspection even when the script fails.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dmg-diagnostics
          path: diag/
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            target/universal/release/bundle/dmg/*.dmg
            octowatcher-macos.tar.gz

  linux:
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-linux
        with:
          rpm: true
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/generate-rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  release:
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The self-updater looks for these names (src/updater.rs).
      - name: Check self-update downloads
        working-directory: dist
        run: |
          status=0
          for name in 'octowatcher-macos.tar.gz' 'octowatcher_*_x86_64.AppImage'; do
            if [ -z "$(find . -type f -name "$name")" ]; then
              echo "::error::dist/ has no $name"
              status=1
            fi
          done
          exit "$status"
      - uses: softprops/action-gh-release@v3
        with:
          # release-please created this tag's release as a draft and wrote its
          # notes. This attaches the downloads, then publishes the draft.
          files: dist/**/*
          fail_on_unmatched_files: true
          draft: false
