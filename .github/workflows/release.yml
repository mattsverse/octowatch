name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUNDLE_VERSION: 0.12.0
  CARGO_GENERATE_RPM_VERSION: 0.21.0

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-bundle --version "$CARGO_BUNDLE_VERSION" --locked
      # Two targets are combined with lipo into one universal app.
      - run: cargo bundle --release --format dmg -t aarch64-apple-darwin -t x86_64-apple-darwin
      # The dmg is for first installs; self-updates swap in the bare bundle.
      # COPYFILE_DISABLE keeps macOS metadata (._ files) out of the archive.
      - run: COPYFILE_DISABLE=1 tar -C target/universal/release/bundle/dmg -czf octowatcher-macos.tar.gz Octowatcher.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            target/universal/release/bundle/dmg/*.dmg
            octowatcher-macos.tar.gz

  linux:
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo install cargo-bundle --version "$CARGO_BUNDLE_VERSION" --locked
          cargo install cargo-generate-rpm --version "$CARGO_GENERATE_RPM_VERSION" --locked
      - run: cargo build --release
      - run: |
          for format in deb appimage; do
            cargo bundle --release --format "$format" --binary-path target/release/octowatcher
          done
      # cargo-bundle's rpm format is still a stub.
      - run: cargo generate-rpm
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/generate-rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  release:
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          # release-please already wrote the notes; this only attaches assets.
          files: dist/**/*
