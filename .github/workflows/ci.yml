name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux only: behavioral tests plus an isolated native D-Bus contract test.
  # Live desktop rendering still requires a macOS/Linux desktop check.
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v7
        # cargo test runs dependency build scripts; keep the token out of reach.
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - run: cargo test --locked
      - name: Test the Linux notification service contract
        run: |
          sudo apt-get install -y python3-dbus python3-gi dbus-daemon
          tests/test-linux-notifications.sh
