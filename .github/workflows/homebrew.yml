name: Publish Homebrew cask

on:
  workflow_call:
    inputs:
      tag:
        description: Published stable release tag (for example v0.6.0)
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v0.6.0)
        required: true
        type: string

permissions:
  contents: read

# An older queued release cannot overwrite a newer cask: the script also checks
# the version already in the tap. Accordo's independent tap updates are rebased.
concurrency:
  group: octowatcher-homebrew
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo '::error::Set HOMEBREW_TAP_TOKEN in this repository or grant access to the organization secret.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: mattsverse/homebrew-tap
          ref: main
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Verify tap push access without changing it
        working-directory: tap
        run: git push --dry-run origin HEAD:main
      - name: Verify published DMG and update cask
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 source/packaging/homebrew/update_cask.py "$RELEASE_TAG" tap/Casks/octowatcher.rb
      - name: Commit and push cask
        working-directory: tap
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Casks/octowatcher.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(octowatcher): release $RELEASE_TAG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
