name: Preview

# Builds unsigned bundles for a pull request carrying the `preview` label,
# and comments their download links. Opt-in, since the macOS runner is the
# expensive part of CI.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    # Branches of this repository only: once labeled, a fork's pushes would
    # otherwise start builds on our runners. On `labeled`, only the preview
    # label itself starts a build.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: blacksmith-6vcpu-macos-15
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
      # Apple Silicon only and no notarization: a preview needs neither.
      - id: build
        uses: ./.github/actions/build-macos
      # Ad-hoc signed, so Gatekeeper still quarantines the download.
      - env:
          BUNDLE_DIR: ${{ steps.build.outputs.bundle-dir }}
        run: |
          codesign --force --sign - "$BUNDLE_DIR/osx/Octowatcher.app"
          COPYFILE_DISABLE=1 tar -C "$BUNDLE_DIR/osx" -czf octowatcher-macos-preview.tar.gz Octowatcher.app
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: macos-preview
          path: octowatcher-macos-preview.tar.gz
          retention-days: 7

  linux:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: blacksmith-4vcpu-ubuntu-2204
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-linux
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: linux-preview
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          retention-days: 7

  comment:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # One comment per PR, found by its marker and edited on every build.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MACOS_URL: ${{ needs.macos.outputs.artifact-url }}
          LINUX_URL: ${{ needs.linux.outputs.artifact-url }}
        run: |
          marker='<!-- octowatcher-preview -->'
          body="$marker
          ### Preview bundles

          Built from ${SHA:0:7} in [this run]($RUN_URL). Links expire on $(date -u -d '+7 days' +%Y-%m-%d).

          - **macOS** (Apple Silicon): [macos-preview.zip]($MACOS_URL). Unsigned, so clear the quarantine before opening: \`xattr -dr com.apple.quarantine Octowatcher.app\`
          - **Linux** (.deb and AppImage): [linux-preview.zip]($LINUX_URL)"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
