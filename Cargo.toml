[workspace]
resolver = "3"
members = ["crates/octowatcher-core", "crates/octowatcher"]

# release-please bumps this version and both crates' Cargo.lock entries together.
[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mattsverse/octowatch"
authors = ["Matteo Gassend"]

[workspace.dependencies]
octowatcher-core = { path = "crates/octowatcher-core" }
anyhow = "1.0.104"
async-channel = "2.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
futures-lite = "2.6"
libc = "0.2"
png = "0.18"
# Rune is pre-release: pin a `dev` revision, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27"
tray-icon = "0.26"
unicode-segmentation = "1.13"
