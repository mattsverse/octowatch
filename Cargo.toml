[workspace]
resolver = "3"
members = ["crates/octowatcher-core", "crates/octowatcher"]

# release-please bumps this version and both crates' Cargo.lock entries together.
[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/mattsverse/octowatch"
authors = ["Matteo Gassend"]

[workspace.dependencies]
octowatcher-core = { path = "crates/octowatcher-core" }
anyhow = "1.0.104"
async-channel = "2.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
futures-lite = "2.6"
gpui = "0.2.2"
libc = "0.2"
png = "0.18"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27"
tray-icon = "0.26"
unicode-segmentation = "1.13"
